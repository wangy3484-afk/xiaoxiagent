[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-strategy-agent"
version = "0.1.0"
description = "Evidence-based operations strategy agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "celery[redis]>=5.5,<6",
  "fastapi>=0.118,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
